# Library CI on every push and merge request. Nothing is released from here:
# crates.io publishing is done by hand.

image: rust:1

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
  CARGO_TERM_COLOR: always

cache:
  key: cargo-${CI_JOB_NAME}
  paths: [.cargo-home/registry, target/]

stages: [test]

test:
  stage: test
  script:
    - rustup component add clippy
    - cargo build --all-features
    - cargo test --all-features
    - cargo test
    - cargo clippy --all-targets --all-features -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
    - cargo run --example quickstart
    - cargo run --example shared_text --features text
    - cargo run --example task_board --features hlc,msgpack
    - rustup target add wasm32-unknown-unknown
    - cargo build --target wasm32-unknown-unknown --all-features

# The oldest Rust this crate promises to build on (rust-version in Cargo.toml).
msrv:
  stage: test
  image: rust:1.85
  variables:
    # pick dependency versions that support this Rust
    CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  script:
    - cargo build --all-features
